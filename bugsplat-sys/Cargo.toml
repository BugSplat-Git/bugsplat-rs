[package]
name = "bugsplat-sys"
description = "Raw FFI bindings to bugsplat-native, BugSplat's out-of-process crash reporter (Crashpad)"
version.workspace = true
edition.workspace = true
# The vendored bugsplat-native source includes WTL (MS-PL), used by the Windows reporter.
license = "MIT AND MS-PL"
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
links = "bugsplat"
build = "build.rs"
categories = ["external-ffi-bindings", "development-tools::debugging"]
keywords = ["bugsplat", "crash", "minidump", "crashpad", "crash-reporting"]
# Only what the build reads, plus license texts: the crate is how bugsplat-native's source is
# published, so its CI, docs, design notes, bindings, tests and samples stay out.
include = [
  "/build.rs",
  "/src/**",
  "/cmake/**",
  "/bugsplat-native/CMakeLists.txt",
  "/bugsplat-native/VERSION",
  "/bugsplat-native/LICENSE",
  "/bugsplat-native/cmake/**",
  "/bugsplat-native/include/**",
  "/bugsplat-native/src/**",
  "/bugsplat-native/monitor/**",
  "/bugsplat-native/wer/**",
  "/bugsplat-native/reporter/CMakeLists.txt",
  "/bugsplat-native/reporter/fixtures/**",
  "/bugsplat-native/reporter/res/**",
  "/bugsplat-native/reporter/src/**",
  "/bugsplat-native/reporter/theme/**",
  "/bugsplat-native/reporter/ui/**",
  "/bugsplat-native/scripts/apple/codesign.sh",
  "/bugsplat-native/third_party/miniz/LICENSE",
  "/bugsplat-native/third_party/miniz/miniz.c",
  "/bugsplat-native/third_party/miniz/miniz.h",
  "/bugsplat-native/third_party/nlohmann/**",
  "/bugsplat-native/third_party/wtl/**",
]

[build-dependencies]
cmake = "0.1.54"
