[package]
name = "bugsplat-sys"
description = "Raw FFI bindings to bugsplat-native, BugSplat's out-of-process crash reporter (Crashpad)"
version.workspace = true
edition.workspace = true
# The vendored bugsplat-native source includes WTL (MS-PL), used by the Windows reporter.
license = "MIT AND MS-PL"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
links = "bugsplat"
build = "build.rs"
categories = ["external-ffi-bindings", "development-tools::debugging"]
keywords = ["bugsplat", "crash", "minidump", "crashpad", "crash-reporting"]
exclude = ["bugsplat-native/third_party/**/test*", "bugsplat-native/tests/**", "bugsplat-native/samples/**"]

[build-dependencies]
cmake = "0.1.54"
