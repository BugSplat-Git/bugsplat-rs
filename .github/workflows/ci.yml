name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # bugsplat-native is private until it is published; a token with read access is needed.
          token: ${{ secrets.BUGSPLAT_NATIVE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Linux packages (Tauri plugin)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            .crashpad-cache
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock', 'bugsplat-sys/bugsplat-native/cmake/crashpad.lock') }}
      - name: cargo test
        run: cargo test --workspace --all-features
        env:
          BUGSPLAT_CRASHPAD_CACHE: ${{ github.workspace }}/.crashpad-cache
      - name: init.js tests
        run: node --test tauri-plugin-bugsplat/js/init.test.js
      - name: clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: docs build as on docs.rs (which skips the native build)
        if: runner.os == 'Linux'
        run: cargo doc --workspace --all-features --no-deps
        env:
          DOCS_RS: "1"
          BUGSPLAT_NATIVE_SRC: /nonexistent
      - name: package contents (only what the build needs, no private links)
        if: runner.os == 'Linux'
        run: scripts/check-package.sh
      # On every OS: bugsplat-sys's include list must cover each platform's build.
      - name: cargo package (builds each crate from its .crate, as crates.io users will)
        # my-tauri-crasher is a sample app, not a crate: its frontend sits outside the crate
        # directory, so it cannot be built from a .crate (and it is publish = false).
        run: cargo package --workspace --exclude my-tauri-crasher
        env:
          BUGSPLAT_CRASHPAD_CACHE: ${{ github.workspace }}/.crashpad-cache
