[package]
name = "my-tauri-crasher"
description = "Sample Tauri app integrated with BugSplat: native crashes, Rust panics and JavaScript errors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "my_tauri_crasher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
bugsplat = { workspace = true }
tauri-plugin-bugsplat = { path = "../../../tauri-plugin-bugsplat" }
